<!DOCTYPE html>
<html>
<head>
    <title>Simple Table</title>
</head>
<body>

<h2>Simple Table</h2>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>City</th>
    </tr>

    <tr>
        <td>1</td>
        <td>John</td>
        <td>Chennai</td>
    </tr>

    <tr>
        <td>2</td>
        <td>David</td>
        <td>Madurai</td>
    </tr>
</table>

</body>
</html>
