<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .container {
            display: flex;
            gap: 30px;
        }

        .profile-card {
            width: 220px;
            border: 2px solid #333;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            background-color: #f4f4f4;
        }

        input {
            width: 200px;
            padding: 8px;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <h2>Project 1: Live Profile Preview</h2>

    <div class="container">

        <!-- Input Section -->
        <div>
            <label>Name:</label><br>
            <input type="text" id="name" placeholder="Enter your name"><br>

            <label>Age:</label><br>
            <input type="number" id="age" placeholder="Enter your age">
        </div>

        <!-- Profile Card -->
        <div class="profile-card">
            <h3>Profile Card</h3>
            <p><strong>Name:</strong> <span id="displayName">Your Name</span></p>
            <p><strong>Age:</strong> <span id="displayAge">Your Age</span></p>
        </div>

    </div>

    <script>
        const nameInput = document.getElementById("name");
        const ageInput = document.getElementById("age");

        const displayName = document.getElementById("displayName");
        const displayAge = document.getElementById("displayAge");

        // Live update name
        nameInput.addEventListener("input", function () {
            displayName.textContent = this.value || "Your Name";
        });

        // Live update age
        ageInput.addEventListener("input", function () {
            displayAge.textContent = this.value || "Your Age";
        });
    </script>

</body>
</html>
