<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Viewer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f7fb;
      color: #222;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      color: #1f3c88;
      margin-bottom: 20px;
    }

    button {
      display: block;
      margin: 0 auto 20px;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #1f3c88;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #16306b;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .product-card {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 12px;
      background: #fafafa;
      text-align: center;
    }

    .product-card img {
      width: 100%;
      height: 180px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    .product-card h3 {
      font-size: 16px;
      margin: 8px 0;
      color: #1f3c88;
    }

    .product-card p {
      margin: 6px 0;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Product Viewer</h1>
    <button onclick="loadProducts()">Fetch Products</button>
    <div id="productList" class="product-grid"></div>
  </div>

  <script>
    async function loadProducts() {
      const productList = document.getElementById('productList');
      productList.innerHTML = '<p>Loading...</p>';

      try {
        const response = await fetch('https://fakestoreapi.com/products');
        if (!response.ok) {
          throw new Error('Failed to fetch products');
        }

        const products = await response.json();

        productList.innerHTML = products.map(product => `
          <div class="product-card">
            <img src="${product.image}" alt="${product.title}" />
            <h3>${product.title}</h3>
            <p>$${product.price}</p>
          </div>
        `).join('');
      } catch (error) {
        productList.innerHTML = `<p style="color:red;">${error.message}</p>`;
        console.error(error);
      }
    }
  </script>
</body>
</html>
