<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User List App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f7fb;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      color: #1f3c88;
      margin-bottom: 20px;
    }

    button {
      display: block;
      margin: 0 auto 20px;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #1f3c88;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #16306b;
    }

    .user-list {
      display: grid;
      gap: 12px;
    }

    .user-card {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 12px 14px;
      background: #fafafa;
    }

    .user-card h3 {
      margin: 0 0 6px;
    }

    .user-card p {
      margin: 0;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>User List App</h1>
    <button onclick="loadUsers()">Fetch Users</button>
    <div id="userList" class="user-list"></div>
  </div>

  <script>
    async function loadUsers() {
      const userList = document.getElementById('userList');
      userList.innerHTML = '<p>Loading...</p>';

      try {
        const response = await fetch('https://jsonplaceholder.typicode.com/users');
        if (!response.ok) {
          throw new Error('Failed to fetch users');
        }

        const users = await response.json();

        userList.innerHTML = users.map(user => `
          <div class="user-card">
            <h3>${user.name}</h3>
            <p>${user.email}</p>
          </div>
        `).join('');
      } catch (error) {
        userList.innerHTML = `<p style="color:red;">${error.message}</p>`;
        console.error(error);
      }
    }
  </script>
</body>
</html>
