<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post Viewer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f7fb;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      color: #1f3c88;
      margin-bottom: 20px;
    }

    button {
      display: block;
      margin: 0 auto 20px;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #1f3c88;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #16306b;
    }

    .post-list {
      display: grid;
      gap: 12px;
    }

    .post-card {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 14px;
      background: #fafafa;
    }

    .post-card h3 {
      margin: 0 0 8px;
      color: #1f3c88;
    }

    .post-card p {
      margin: 0;
      line-height: 1.5;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Post Viewer</h1>
    <button onclick="loadPosts()">Fetch Posts</button>
    <div id="postList" class="post-list"></div>
  </div>

  <script>
    async function loadPosts() {
      const postList = document.getElementById('postList');
      postList.innerHTML = '<p>Loading...</p>';

      try {
        const response = await fetch('https://jsonplaceholder.typicode.com/posts');
        if (!response.ok) {
          throw new Error('Failed to fetch posts');
        }

        const posts = await response.json();

        postList.innerHTML = posts.map(post => `
          <div class="post-card">
            <h3>${post.title}</h3>
            <p>${post.body}</p>
          </div>
        `).join('');
      } catch (error) {
        postList.innerHTML = `<p style="color:red;">${error.message}</p>`;
        console.error(error);
      }
    }
  </script>
</body>
</html>
