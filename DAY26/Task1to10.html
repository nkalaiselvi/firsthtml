<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Practice</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .user-card {
      border: 1px solid #ccc;
      padding: 15px;
      margin: 10px 0;
      border-radius: 8px;
    }

    input {
      padding: 10px;
      width: 300px;
      margin-bottom: 20px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: left;
    }

    th {
      background: #f2f2f2;
    }
  </style>
</head>

<body>

  <h1>API Practice</h1>

  <!-- Task 3 -->
  <h2>Usernames</h2>
  <ul id="usernameList"></ul>

  <!-- Task 4 -->
  <h2>Emails</h2>
  <ul id="emailList"></ul>

  <!-- Task 5 -->
  <h2>First 5 Users</h2>
  <div id="firstFive"></div>

  <!-- Task 7 -->
  <h2>Products</h2>
  <div id="products"></div>

  <!-- Task 8 -->
  <h2>User Cards</h2>
  <div id="userCards"></div>

  <!-- Task 9 -->
  <h2>Users Table</h2>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Username</th>
        <th>Email</th>
      </tr>
    </thead>
    <tbody id="userTable"></tbody>
  </table>

  <!-- Task 10 -->
  <h2>Search Users</h2>
  <input
    type="text"
    id="searchInput"
    placeholder="Search by username..."
  >

  <div id="searchResults"></div>


  <script>

    // APIs
    const usersAPI = "https://jsonplaceholder.typicode.com/users";
    const postsAPI = "https://jsonplaceholder.typicode.com/posts";
    const productsAPI = "https://dummyjson.com/products";


    // Task 6
    // Using async/await
    async function fetchData() {

      try {

        // --------------------------------
        // Task 1: Fetch Users API
        // --------------------------------

        const userResponse = await fetch(usersAPI);

        const users = await userResponse.json();

        console.log("TASK 1 - Users:");
        console.log(users);


        // --------------------------------
        // Task 2: Fetch Posts API
        // --------------------------------

        const postResponse = await fetch(postsAPI);

        const posts = await postResponse.json();

        console.log("TASK 2 - Posts:");
        console.log(posts);


        // --------------------------------
        // Task 3: Display Usernames
        // --------------------------------

        const usernameList =
          document.getElementById("usernameList");

        users.forEach(user => {

          const li = document.createElement("li");

          li.textContent = user.username;

          usernameList.appendChild(li);

        });


        // --------------------------------
        // Task 4: Display Emails Only
        // --------------------------------

        const emailList =
          document.getElementById("emailList");

        users.forEach(user => {

          const li = document.createElement("li");

          li.textContent = user.email;

          emailList.appendChild(li);

        });


        // --------------------------------
        // Task 5: Display First 5 Users
        // --------------------------------

        const firstFive =
          document.getElementById("firstFive");

        const firstFiveUsers = users.slice(0, 5);

        firstFiveUsers.forEach(user => {

          const p = document.createElement("p");

          p.textContent = user.name;

          firstFive.appendChild(p);

        });


        // --------------------------------
        // Task 8: Create User Card List
        // --------------------------------

        const userCards =
          document.getElementById("userCards");

        users.forEach(user => {

          const card = document.createElement("div");

          card.className = "user-card";

          card.innerHTML = `
            <h3>${user.name}</h3>
            <p>Username: ${user.username}</p>
            <p>Email: ${user.email}</p>
            <p>Phone: ${user.phone}</p>
            <p>City: ${user.address.city}</p>
          `;

          userCards.appendChild(card);

        });


        // --------------------------------
        // Task 9: Display API Data in Table
        // --------------------------------

        const userTable =
          document.getElementById("userTable");

        users.forEach(user => {

          const row = document.createElement("tr");

          row.innerHTML = `
            <td>${user.id}</td>
            <td>${user.name}</td>
            <td>${user.username}</td>
            <td>${user.email}</td>
          `;

          userTable.appendChild(row);

        });


        // --------------------------------
        // Task 10: Search Filter
        // --------------------------------

        const searchInput =
          document.getElementById("searchInput");

        const searchResults =
          document.getElementById("searchResults");


        searchInput.addEventListener("input", () => {

          const searchText =
            searchInput.value.toLowerCase();

          const filteredUsers = users.filter(user =>
            user.username
              .toLowerCase()
              .includes(searchText)
          );


          searchResults.innerHTML = "";


          filteredUsers.forEach(user => {

            const p = document.createElement("p");

            p.textContent =
              `${user.name} - ${user.username}`;

            searchResults.appendChild(p);

          });

        });


        // --------------------------------
        // Task 7: Products Fake API
        // --------------------------------

        const productResponse =
          await fetch(productsAPI);

        const productData =
          await productResponse.json();

        console.log("TASK 7 - Products:");
        console.log(productData);


        const products =
          document.getElementById("products");


        productData.products.forEach(product => {

          const div = document.createElement("div");

          div.className = "user-card";

          div.innerHTML = `
            <h3>${product.title}</h3>
            <p>Price: $${product.price}</p>
            <p>Category: ${product.category}</p>
          `;

          products.appendChild(div);

        });


      } catch (error) {

        console.error("Error fetching API:", error);

      }

    }


    // Start program
    fetchData();

  </script>

</body>
</html>
