<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!DOCTYPE html>
<html>
<head>
    <title>Product Info</title>
</head>
<body>

<button onclick="showProduct()">Show Product</button>

<h2 id="pname"></h2>
<p id="price"></p>
<p id="brand"></p>

<script>
function showProduct() {
    document.getElementById("pname").innerHTML = "Product: Laptop";
    document.getElementById("price").innerHTML = "Price: ₹50,000";
    document.getElementById("brand").innerHTML = "Brand: Dell";
}
</script>

</body>
</html>
</body>
</html>
