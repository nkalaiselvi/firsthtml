<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2 id="name">Name: John</h2>
<h2 id="age">Age: 20</h2>

<button onclick="showProfile()">View Profile</button>

<script>
function showProfile() {
    document.getElementById("name").innerHTML = "Name: Alice";
    document.getElementById("age").innerHTML = "Age: 25";
}
</script>
</body>
</html>
