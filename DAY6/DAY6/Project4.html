<!DOCTYPE html>
<html>
<head>
    <title>Simple Website Layout</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
        }

        .header {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 20px;
            margin: 10px;
            border: 2px solid black;
        }

        .content {
            background-color: white;
            padding: 30px;
            margin: 10px;
            border: 2px solid gray;
            min-height: 200px;
        }

        .footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px;
            margin: 10px;
            border: 2px solid black;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Website Header</h1>
    </div>

    <div class="content">
        <h2>Content Section</h2>
        <p>This is the main content area of the website.</p>
    </div>

    <div class="footer">
        <p>© 2026 My Website. All Rights Reserved.</p>
    </div>

</body>
</html>
