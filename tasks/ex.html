<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .box{
        width: 100px;
        height: 100px;
        border: 5px solid blue;
        background-color: aqua;
        padding: 20px;
        margin: 50px 10px 60px 30px;
        
    }
    .box1{
        width: 100px;
        height: 100px;
        border:5px dashed pink;
        background-color: aqua;
        padding: 20px;
        margin: 50px 10px 60px 30px;
    }
    .box2{
        width: 100px;
        height: 100px;
        border: 8px dotted black;
        background-color: aqua;
        padding: 20px;
        margin: 50px 10px 60px 30px;
    }
    .card{
        width: 200px;
        padding: 20px 60px 10px 30px;
        border: 2px dashed green;
    }
    .center-box{
        width: 300px;
        height: 150px;
        border:2px solid red;
        margin: 30px auto;
        text-align: center;
        line-height: 150px;
    }
    .profile-card{
        
        
    }

</style>
<body>
    <div class="box">hello world</div>
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="card">Invitation</div>
    <div class="center-box">center</div>
    <div class="profile-card">profile card</div>
    
</body>
</html>
