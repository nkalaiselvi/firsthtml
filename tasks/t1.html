<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Example</title>

    <style>
        .container {
            display: flex;
            gap: 10px;
            border: 2px solid black;
            padding: 10px;
        }

        .box {
            width: 60px;
            height: 60px;
            background-color: skyblue;
            border: 1px solid black;
            text-align: center;
            line-height: 60px;
            font-size: 20px;
        }

        .one {
            order: 2;
        }

        .two {
            order: 1;
        }

        .three {
            order: 3;
        }
    </style>
</head>
<body>

    <h2>CSS Flexbox - Order Property</h2>

    <div class="container">
        <div class="box one">1</div>
        <div class="box two">2</div>
        <div class="box three">3</div>
    </div>

    <p><strong>HTML Order:</strong> 1 2 3</p>
    <p><strong>Display Order:</strong> 2 1 3</p>

</body>
</html>
