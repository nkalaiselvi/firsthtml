<!DOCTYPE html>
<html>
<head>
<style>
.container {
    display: flex;
    border: 2px solid black;
}

.box {
    color: white;
    padding: 20px;
    text-align: center;
}

.red {
    background: red;
    flex-basis: 100px;
}

.green {
    background: green;
    flex-basis: 200px;
}

.blue {
    background: blue;
    flex-basis: 300px;
}
</style>
</head>
<body>

<h2>flex-basis Example</h2>

<div class="container">
    <div class="box red">100px</div>
    <div class="box green">200px</div>
    <div class="box blue">300px</div>
</div>

</body>
</html>
