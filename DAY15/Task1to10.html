   <script>
    // Task 1: Create a variable for your name and print it
let name = "Kalai";
console.log(name);

// Task 2: Create a variable for your age

let language = "Java";
language = "JavaScript";

// Task 5: Use const for country name

// Task 6: Print 3 variables using console.log
console.log(name);
console.log(age);
console.log(city);

// Task 7: Create variables for student details (name, age, course)
let studentName = "Rahul";
let studentAge = 19;
let course = "BCA";

console.log(studentName);
console.log(studentAge);
console.log(course);

// Task 8: Try var, let, const and observe differences

let grade = "A";

console.log(pinCode);

// Changing values
school = "XYZ School"; // Allowed
grade = "A+";          // Allowed
// pinCode = 626002;   // Not Allowed (Error)

console.log(school);
console.log(grade);

// Task 9: Create a simple profile using variables
