    <script>
        function login(username, password) {
    let correctUsername = "admin";
    let correctPassword = "12345";

        return "Login Successful";
    } else {
        return "Login Failed";
    }
}

// Output
console.log(login("admin", "12345"));
console.log(login("admin", "11111"));
