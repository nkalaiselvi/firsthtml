<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Page</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f2f2f2;

    /* Flexbox */
    display:flex;
    justify-content:center; /* Horizontal Center */
    align-items:center;     /* Vertical Center */
    height:100vh;
}

.login-box{
    width:300px;
    padding:20px;
    background:white;
    border-radius:8px;
    box-shadow:0 0 10px gray;

    display:flex;
    flex-direction:column;
    gap:15px;
}

.login-box h2{
    text-align:center;
}

.login-box input{
    padding:10px;
    font-size:16px;
}

.login-box button{
    padding:10px;
    background:#007BFF;
    color:white;
    border:none;
    font-size:16px;
    cursor:pointer;
}

.login-box button:hover{
    background:#0056b3;
}
</style>

</head>
<body>

<div class="login-box">

    <h2>Login</h2>

    <input type="text" placeholder="Username">

    <input type="password" placeholder="Password">

    <button>Login</button>

</div>

</body>
</html>
