<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Cards</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    .product-container {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
        padding: 20px;
    }

    .product-card {
        width: calc(25% - 15px); /* 4 cards per row */
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 15px;
        text-align: center;
        background: #fff;
    }

    .product-card img {
        width: 100%;
        height: 180px;
        object-fit: cover;
        border-radius: 5px;
    }

    .product-card h3 {
        margin: 10px 0;
    }

    .product-card p {
        color: #555;
    }

    .product-card button {
        margin-top: 10px;
        padding: 10px 15px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    .product-card button:hover {
        background: #0056b3;
    }
</style>
</head>

<body>
<h1>Product Card Layout</h1>
<div class="product-container">

    <div class="product-card">
        <img src="/image/pro1.jpg" alt="Product">
        <h3>Product 1</h3>
        <p>$49.99</p>
        <button>Buy Now</button>
    </div>

    <div class="product-card">
        <img src="/image/pro2.jpg" alt="Product">
        <h3>Product 2</h3>
        <p>$39.99</p>
        <button>Buy Now</button>
    </div>

    <div class="product-card">
        <img src="/image/pro3.jpg" alt="Product">
        <h3>Product 3</h3>
        <p>$59.99</p>
        <button>Buy Now</button>
    </div>

    <div class="product-card">
        <img src="/image/pro4.jpg" alt="Product">
        <h3>Product 4</h3>
        <p>$29.99</p>
        <button>Buy Now</button>
    </div>

</div>

</body>
</html>
