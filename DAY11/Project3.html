<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Layout</title>
    <link rel="stylesheet" href="Project3.css">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <h1>My E-commerce Store</h1>
    </header>

    <div class="container">

        <!-- Sidebar -->
        <aside class="sidebar">
            <h2>Filters</h2>
            <ul>
                <li>Electronics</li>
                <li>Clothing</li>
                <li>Footwear</li>
                <li>Accessories</li>
                <li>Books</li>
            </ul>
        </aside>

        <!-- Product Grid -->
        <main class="content">
            <h2>Products</h2>

            <div class="products">

                <div class="product">
                    <h3>Product 1</h3>
                    <p>₹500</p>
                </div>

                <div class="product">
                    <h3>Product 2</h3>
                    <p>₹700</p>
                </div>

                <div class="product">
                    <h3>Product 3</h3>
                    <p>₹900</p>
                </div>

                <div class="product">
                    <h3>Product 4</h3>
                    <p>₹1200</p>
                </div>

                <div class="product">
                    <h3>Product 5</h3>
                    <p>₹1500</p>
                </div>

                <div class="product">
                    <h3>Product 6</h3>
                    <p>₹2000</p>
                </div>

            </div>
        </main>

    </div>

</body>
</html>
