<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="Project2.css">
</head>
<body>

<div class="container">

    <!-- Sidebar -->
    <aside class="sidebar">
        <h2>Dashboard</h2>
        <ul>
            <li>Home</li>
            <li>Users</li>
            <li>Analytics</li>
            <li>Reports</li>
            <li>Settings</li>
            <li>Logout</li>
        </ul>
    </aside>

    <!-- Main Content -->
    <main class="main">
        <h1>Admin Dashboard</h1>

        <div class="cards">
            <div class="card">
                <h3>Users</h3>
                <p>1200</p>
            </div>

            <div class="card">
                <h3>Sales</h3>
                <p>$8,500</p>
            </div>

            <div class="card">
                <h3>Orders</h3>
                <p>350</p>
            </div>

            <div class="card">
                <h3>Revenue</h3>
                <p>$15,000</p>
            </div>
        </div>

        <div class="analytics">
            <h2>Analytics</h2>
            <p>This section contains charts and reports.</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        © 2026 Admin Dashboard
    </footer>

</div>

</body>
</html>
