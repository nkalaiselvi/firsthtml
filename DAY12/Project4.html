<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Admin Dashboard</title>
    <link rel="stylesheet" href="Project4.css">
</head>
<body>

<div class="dashboard">

    <!-- Sidebar -->
    <aside class="sidebar">
        <h2>Admin</h2>

        <ul>
            <li>Dashboard</li>
            <li>Users</li>
            <li>Products</li>
            <li>Orders</li>
            <li>Settings</li>
        </ul>
    </aside>

    <!-- Main Content -->
    <div class="main">

        <header>
            <h1>Dashboard</h1>
        </header>

        <section class="cards">

            <div class="card">
                <h3>Total Users</h3>
                <p>1,250</p>
            </div>

            <div class="card">
                <h3>Orders</h3>
                <p>340</p>
            </div>

            <div class="card">
                <h3>Revenue</h3>
                <p>$12,500</p>
            </div>

        </section>

    </div>

</div>

</body>
</html>
