<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Product Cards</title>
    <link rel="stylesheet" href="Project2.css">
</head>
<body>

<div class="product-container">

    <div class="product-card">
        <img src="pro2.jpg" alt="Product 1">
        <h2>Product 1</h2>
        <p>High-quality product for everyday use.</p>
        <h3>$25</h3>
        <button>Buy Now</button>
    </div>

    <div class="product-card">
        <img src="pro1.jpg" alt="Product 2">
        <h2>Product 2</h2>
        <p>Stylish and durable with premium features.</p>
        <h3>$40</h3>
        <button>Buy Now</button>
    </div>

    <div class="product-card">
        <img src="pro3.jpg" alt="Product 3">
        <h2>Product 3</h2>
        <p>Perfect choice for work and daily activities.</p>
        <h3>$55</h3>
        <button>Buy Now</button>
    </div>

</div>

</body>
</html>
